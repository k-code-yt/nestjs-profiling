apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
        - name: create-dashboards-dir
          image: busybox
          command: ['sh', '-c', 'mkdir -p /var/lib/grafana/dashboards']
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: 'admin123'
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_SERVER_ROOT_URL
              value: 'http://localhost/grafana'
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: 'true'
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard-memory-leak
              mountPath: /var/lib/grafana/dashboards/memory-leak.json
              subPath: memory-leak.json
            - name: grafana-dashboard-nestjs
              mountPath: /var/lib/grafana/dashboards/nestjs-memory-profiling.json
              subPath: nestjs-memory-profiling.json
            - name: grafana-dashboard-bandwidth
              mountPath: /var/lib/grafana/dashboards/bandwidth-monitoring.json
              subPath: bandwidth-monitoring.json
          resources:
            limits:
              memory: '512Mi'
              cpu: '500m'
            requests:
              memory: '256Mi'
              cpu: '200m'
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: grafana-dashboards
          emptyDir: {}
        - name: grafana-dashboard-memory-leak
          configMap:
            name: grafana-dashboard-memory-leak
        - name: grafana-dashboard-nestjs
          configMap:
            name: grafana-dashboard-nestjs
        - name: grafana-dashboard-bandwidth
          configMap:
            name: grafana-dashboard-bandwidth

---
# service-grafana.yml
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
