apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-app
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nestjs-app
  template:
    metadata:
      labels:
        app: nestjs-app
    spec:
      containers:
        - name: nestjs-app
          image: nest-profiling-test-nestjs-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
            - containerPort: 9229
          env:
            - name: NODE_ENV
              value: 'development'
            - name: NODE_OPTIONS
              value: '--max-old-space-size=1000 --expose-gc'
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            limits:
              memory: '1024Mi'
              cpu: '1000m'
            requests:
              memory: '1024Mi'
              cpu: '500m'
          volumeMounts:
            - name: heap-snapshots
              mountPath: /app/heap-snapshots
            - name: cpu-profiles
              mountPath: /app/cpu-profiles
          livenessProbe:
            httpGet:
              path: /profiling/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /profiling/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: heap-snapshots
          emptyDir: {}
        - name: cpu-profiles
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nestjs-app
  namespace: monitoring
spec:
  selector:
    app: nestjs-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: debug
      port: 9229
      targetPort: 9229
  type: ClusterIP
